name: huichuang_basic
description: "惠窗中小学端 — unofficial Flutter client for basic.smartedu.cn (个人学习用途，非商业)."
publish_to: 'none'

version: 0.1.0+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # Video player (same stack as PiliPlus; mpv backend plays AES-128 HLS natively)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Networking & crypto
  dio: ^5.9.1
  crypto: ^3.0.3
  pointycastle: ^3.9.1

  # State & storage
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^11.0.0

  # Platform integration
  local_auth: ^3.0.2
  local_auth_android: ^2.0.8
  local_auth_darwin: ^2.0.3
  flutter_inappwebview: ^6.1.5
  desktop_webview_window: ^0.3.0
  window_manager: ^0.4.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  package_info_plus: ^10.0.0

  # UI
  cached_network_image: ^3.4.1
  pdfrx: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  adaptive_icon_background: "#2368EB"
  adaptive_icon_foreground: assets/icon.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon.png
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256
  linux:
    generate: true
    image_path: assets/icon.png

flutter:
  uses-material-design: true

# Vendored from pub.dev desktop_webview_window 0.3.0 with Linux crash fixes
# (see third_party/desktop_webview_window): hc1 — destroy handler read the
# window object after close erased it (UAF); hc2 — clearAll iterated the
# window map while Close() erased from it under the loop (UAF after login);
# hc3 — webview forced to software rendering, else WebKitWebProcess segfaults
# in libnvidia-eglcore on close; hc4 — title bar is native GTK, not a second
# Flutter Engine, whose GL teardown aborts the process on NVIDIA EGL (the
# "flash crash after login"); hc5 — Windows NavigationStarting is notify-only
# (upstream's cancel→Dart-reply→re-navigate dance froze JS-initiated
# navigations in the login webview); hc6 — Linux DecidePolicy no longer calls
# the Flutter engine from the WebKit signal (SIGTRAP on the AppImage build's
# bundled WebKitGTK when the login navigation started); hc7 — compositing mode
# disabled via env before the web process spawns (hc3's settings policy alone
# still left the login webview blank on NVIDIA); hc8 — DMABUF renderer also
# disabled via env: WebKitGTK ≥2.42 still initializes EGL in the WebKitWebProcess
# for DMABUF tiles, and NVIDIA's driver segfaults that process on teardown
# (coredump at window close, driver 610.57.04). Dart-side: the login token
# watcher pushes from any *.smartedu.cn origin (WebKitGTK ≥2.46 only exposes
# script handlers as window.webkit.messageHandlers.<name>; the post-login
# redirect host varies). Drop the override once upstream ships fixes.
#
# Vendored from pub.dev flutter_inappwebview_android 1.1.3 with the AGP 9
# proguard fix upstream already has on master (proguard-android.txt →
# proguard-android-optimize.txt; AGP 9 hard-errors on the legacy file).
# Drop the override once upstream ships ≥1.1.4/1.2.0.
# Vendored from pub.dev pdfrx 2.4.8: createImage swaps BGRA→RGBA and
# uploads as PixelFormat.rgba8888 (upstream bgra8888 raw uploads composite
# to blank pages on a Pixel 9 Pro Fold, Tensor G3 / Mali-G715, Android 16).
# Upstream path kept as fallback. Drop the override once upstream grows a
# pixel-format workaround or the platform bug is pinned down.
dependency_overrides:
  desktop_webview_window:
    path: third_party/desktop_webview_window
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
  pdfrx:
    path: third_party/pdfrx
