# Desktop release builds — macOS / Linux / Windows.
#
# Triggers:
#   - Manual dispatch (Actions → desktop-build → Run workflow) with an
#     optional platform filter and an optional release tag to attach to.
#   - A STABLE GitHub release being published builds every platform and
#     attaches the archives. A PRERELEASE builds NOTHING — ship its
#     artifacts by dispatching this workflow (desktop and/or android)
#     with the platform(s) you want and attach_tag set to the prerelease.
#
# Deliberately NOT wired to push/commit messages: a full three-platform
# build is expensive, and commit-message-driven CI tempts you to push
# junk commits just to kick a build. Use the button.
#
# Artifacts:
#   - Every run uploads zips/tarballs as workflow artifacts.
#   - On a published stable release (or when attach_tag is set) the
#     archives are also attached to that release.
#
# Caveat: the macOS job signs ad-hoc (no certificate in CI). The app runs
# fine, but Keychain items are bound to the signing identity, so the
# credential vault may not survive reinstalling a freshly built artifact.
# For a vault-reliable macOS build, sign locally per README/AGENTS.
name: desktop-build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platform to build
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - linux-x64
          - windows-x64
      attach_tag:
        description: 'Release tag to attach the archive(s) to (empty = artifact only)'
        type: string
        default: ''
  release:
    types: [published]

# gh release upload needs contents: write (the default GITHUB_TOKEN is
# read-only and 403s with "Resource not accessible by integration").
permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job-level `if` cannot see `matrix` (it is evaluated before the
  # strategy expands), so platform selection and the prerelease guard
  # resolve here into the matrix the build job will run.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - id: select
        run: |
          all='[{"name":"macos-arm64","os":"macos-14"},{"name":"linux-x64","os":"ubuntu-24.04"},{"name":"windows-x64","os":"windows-2022"}]'
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            # Prereleases never start automatic builds; the artifacts are
            # shipped by dispatching this workflow with attach_tag set.
            if [ "$PRERELEASE" = "true" ]; then
              echo "include=[]" >> "$GITHUB_OUTPUT"
            else
              echo "include=$all" >> "$GITHUB_OUTPUT"
            fi
          else
            case "$PLATFORMS" in
              all) echo "include=$all" >> "$GITHUB_OUTPUT" ;;
              macos-arm64) echo 'include=[{"name":"macos-arm64","os":"macos-14"}]' >> "$GITHUB_OUTPUT" ;;
              linux-x64) echo 'include=[{"name":"linux-x64","os":"ubuntu-24.04"}]' >> "$GITHUB_OUTPUT" ;;
              windows-x64) echo 'include=[{"name":"windows-x64","os":"windows-2022"}]' >> "$GITHUB_OUTPUT" ;;
              *) echo "include=[]" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
        env:
          PLATFORMS: ${{ inputs.platforms }}
          PRERELEASE: ${{ github.event.release.prerelease }}

  build:
    name: ${{ matrix.name }}
    needs: setup
    if: needs.setup.outputs.include != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version (.fvmrc)
        id: fv
        shell: bash
        # .fvmrc is the single source of truth (fvm pin); keep CI in lockstep.
        run: |
          v=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          test -n "$v"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          # The action default is channel: stable, which cannot resolve the
          # pinned beta version (3.48.0-0.3.pre); opt into beta explicitly.
          channel: beta
          cache: true

      - name: Show toolchain
        run: flutter --version && dart --version

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # webkit2gtk-4.1 (soup3-based) — desktop_webview_window prefers it;
          # the 4.0 fallback mixes soup2 headers into its GDateTime code.
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libasound2-dev \
            libmpv-dev libsecret-1-dev libjsoncpp-dev \
            librsvg2-dev libgirepository1.0-dev imagemagick

      # Fixed macOS signing: when the MACOS_CERT_P12_BASE64 /
      # MACOS_CERT_PASSWORD secrets exist, import the certificate into a
      # temporary keychain and sign with the real identity — Keychain items
      # (the credential vault, biometric unlock) then survive reinstalling
      # the artifact. Without the secrets, fall back to ad-hoc.
      - name: Import macOS signing certificate (optional)
        id: macos_cert
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KC="$RUNNER_TEMP/build.keychain"
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -t 3600 "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign
          security unlock-keychain -p "$KC_PW" "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/1)/{print $2; exit}')
          test -n "$IDENTITY"
          TEAM=$(security find-certificate -c "$IDENTITY" -p "$KC" \
            | openssl x509 -noout -subject | sed -nE 's/.*OU = ([^,/]*).*/\1/p')
          test -n "$TEAM"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "team=$TEAM" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build (macOS, certificate signed)
        if: runner.os == 'macOS' && steps.macos_cert.outputs.available == 'true'
        run: |
          PB=macos/Runner.xcodeproj/project.pbxproj
          # Point the project at the imported identity (names contain '/',
          # hence the | delimiter).
          sed -i '' -E \
            -e "s|\"CODE_SIGN_IDENTITY\[sdk=macosx\*\]\" = \"[^\"]*\";|\"CODE_SIGN_IDENTITY[sdk=macosx*]\" = \"${{ steps.macos_cert.outputs.identity }}\";|g" \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e "s|DEVELOPMENT_TEAM = [^;]*;|DEVELOPMENT_TEAM = ${{ steps.macos_cert.outputs.team }};|g" \
            "$PB"
          flutter build macos --release
          codesign -dv build/macos/Build/Products/Release/huichuang_basic.app 2>&1 \
            | grep -vq 'Signature=adhoc'

      - name: Build (macOS, ad-hoc signed)
        if: runner.os == 'macOS' && steps.macos_cert.outputs.available != 'true'
        run: |
          # CI holds no certificate; rewrite signing to ad-hoc in the
          # checked-out project only. Verified locally: the sdk-scoped
          # identity must be overridden too — leaving "Apple Development"
          # with an empty team fails with "requires a development team".
          PB=macos/Runner.xcodeproj/project.pbxproj
          sed -i '' -E \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "[^"]*";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            "$PB"
          flutter build macos --release
          codesign -dv build/macos/Build/Products/Release/huichuang_basic.app 2>&1 \
            | grep -q 'Signature=adhoc'

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          # MSVC 14.5x turns the legacy /await + <experimental/coroutine>
          # pattern (flutter_inappwebview_windows, local_auth_windows) into
          # a hard STL1011 error; the vendor-documented define silences it.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Package (macOS zip with Applications link)
        if: runner.os == 'macOS'
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cd build/macos/Build/Products/Release
          rm -rf stage && mkdir stage
          cp -R huichuang_basic.app stage/
          # Drag-to-install: unzip yields the app next to an Applications
          # alias; dropping the app onto it copies it into /Applications.
          # zip -y keeps Applications a symlink instead of recursing into
          # the real /Applications (ditto cannot archive multiple sources).
          ln -s /Applications stage/Applications
          (cd stage && zip -qry \
            "../huichuang_basic-v${APP_VERSION}-macos-arm64.zip" \
            huichuang_basic.app Applications)

      - name: Package (Linux deb)
        if: runner.os == 'Linux'
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          DEB=debroot
          rm -rf "$DEB"
          # Bundle NOTHING but the app itself: gtk, webkit2gtk, glib,
          # gstreamer and the gdk-pixbuf loaders all resolve from the
          # host, exactly like a local `flutter build linux` run. The
          # rc.3 AppImages kept dying on host/bundle mismatches
          # (WebKitGTK helper spawn paths, Ubuntu glib shadowing, and
          # finally gdk-pixbuf's runner-generated loaders.cache failing
          # to dlopen libpixbufloader-svg on the host -> Gtk assertion
          # -> SIGABRT). A deb installs real files and inherits the
          # session environment untouched. The one soname the app links
          # that is NOT everywhere: libmpv. The runner must be
          # ubuntu-24.04 (noble, libmpv soname 2) so the deb runs on
          # Arch / Debian 12+ / Fedora hosts via their own libmpv2; the
          # jammy build linked libmpv.so.1, which only jammy itself
          # ships.
          install -d "$DEB/usr/lib/huichuang_basic" "$DEB/usr/bin" \
            "$DEB/usr/share/applications" \
            "$DEB/usr/share/icons/hicolor/512x512/apps" "$DEB/DEBIAN"
          cp -r build/linux/x64/release/bundle/. "$DEB/usr/lib/huichuang_basic/"
          printf '#!/bin/sh\nexec /usr/lib/huichuang_basic/huichuang_basic "$@"\n' \
            > "$DEB/usr/bin/huichuang_basic"
          chmod 755 "$DEB/usr/bin/huichuang_basic"
          install -m 644 packaging/linux/huichuang_basic.desktop \
            "$DEB/usr/share/applications/"
          convert assets/icon.png -resize 512x512 \
            "$DEB/usr/share/icons/hicolor/512x512/apps/huichuang_basic.png"
          cat > "$DEB/DEBIAN/control" <<EOF
          Package: huichuang-basic
          Version: $APP_VERSION
          Architecture: amd64
          Maintainer: bluseliu50 <265648257+bluseliu50@users.noreply.github.com>
          Depends: libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0, libmpv2
          Section: education
          Priority: optional
          Description: Unofficial client for basic.smartedu.cn
           Product name: 惠窗中小学端. Non-commercial use only
           (CC BY-NC-SA 4.0).
          EOF
          dpkg-deb --build --root-owner-group "$DEB" \
            "huichuang_basic-v${APP_VERSION}-linux-amd64.deb"

      # Same Flutter build, second package format: a pacman -U
      # installable .pkg.tar.zst, assembled by real makepkg inside an
      # archlinux:base container (pattern replicated from
      # mijailr/arch-makepkg-action, inlined so the staging layout is
      # ours: PKGBUILD + ./stage payload; nothing is published to the
      # AUR or any pacman repo). makepkg refuses to run as root, hence
      # the builder user.
      - name: Package (Arch pacman)
        if: runner.os == 'Linux'
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          # pkgver may not contain '-' (pkgrel separator). Dropping it
          # (0.1.0-rc.3 -> 0.1.0rc.3) vercmp-sorts BEFORE 0.1.0, unlike
          # '_' or '~' which both sort after the final release.
          PKGVER=${APP_VERSION//-/}
          STAGE=stage
          rm -rf "$STAGE" pkgbuild
          install -d "$STAGE/usr/lib/huichuang_basic" "$STAGE/usr/bin" \
            "$STAGE/usr/share/applications" \
            "$STAGE/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/x64/release/bundle/. "$STAGE/usr/lib/huichuang_basic/"
          printf '#!/bin/sh\nexec /usr/lib/huichuang_basic/huichuang_basic "$@"\n' \
            > "$STAGE/usr/bin/huichuang_basic"
          chmod 755 "$STAGE/usr/bin/huichuang_basic"
          install -m 644 packaging/linux/huichuang_basic.desktop \
            "$STAGE/usr/share/applications/"
          convert assets/icon.png -resize 512x512 \
            "$STAGE/usr/share/icons/hicolor/512x512/apps/huichuang_basic.png"
          install -d pkgbuild
          sed "s/PLACEHOLDER_VERSION/$PKGVER/" packaging/arch/PKGBUILD \
            > pkgbuild/PKGBUILD
          cp -r "$STAGE" pkgbuild/stage
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD:/work" -w /work/pkgbuild archlinux:base \
            bash -ec '
              pacman -Sy --noconfirm base-devel >/dev/null
              useradd -m builder
              chown -R builder:builder /work/pkgbuild
              su builder -s /bin/bash -c "cd /work/pkgbuild && makepkg --nodeps --noconfirm -f"
              chown -R "$HOST_UID:$HOST_GID" /work/pkgbuild
            '
          mv pkgbuild/huichuang-basic-*.pkg.tar.zst \
            "huichuang_basic-v${APP_VERSION}-x86_64.pkg.tar.zst"
      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = (Select-String '^version:\s*(\S+)' pubspec.yaml |
                      ForEach-Object { $_.Matches[0].Groups[1].Value }) -split '\+' | Select-Object -First 1
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss

      - name: Locate dist files
        id: dist
        shell: bash
        run: |
          # One or two dist files per job (Linux ships a deb AND a
          # pacman package). The macOS zip sits at depth 6
          # (build/macos/Build/Products/Release); Windows/Linux land at
          # the repo root. Multiline output: every consumer word-splits.
          dist=$(find build . -maxdepth 8 \( \
            -name 'huichuang_basic-v*.zip' \
            -o -name 'huichuang_basic-v*.deb' \
            -o -name 'huichuang_basic-v*.pkg.tar.zst' \
            -o -name 'huichuang_basic-v*-setup.exe' \) -print)
          {
            echo "files<<EOF_DIST"
            echo "$dist"
            echo "EOF_DIST"
          } >> "$GITHUB_OUTPUT"
          ls -l $dist

      - uses: actions/upload-artifact@v4
        with:
          name: huichuang_basic-${{ matrix.name }}
          # Exact path: a ** glob makes the action traverse (and follow
          # symlinks through) the whole build tree — the macOS job hung
          # there for the staged .app copy. Archives are already
          # compressed; skip re-compression on upload.
          path: ${{ steps.dist.outputs.files }}
          compression-level: 0
          if-no-files-found: error
      - name: Attach to release
        if: github.event_name == 'release' || inputs.attach_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ATTACH_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.attach_tag }}
        # bash for one syntax across runners. The windows-x64 job hit
        # transient "release not found" 404s on tag->release lookup
        # twice in a row (rc.2, rc.3) minutes after release creation,
        # while mac/linux succeeded — retry the upload instead of
        # failing a 10-minute build over it.
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            gh release upload "$ATTACH_TAG" ${{ steps.dist.outputs.files }} --clobber && exit 0
            echo "attach attempt $i failed; retrying in 20s" >&2
            sleep 20
          done
          exit 1
