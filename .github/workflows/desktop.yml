# Desktop release builds — macOS / Linux / Windows.
#
# Triggered ONLY manually (Actions → Run workflow) and when a GitHub
# Release is published. Deliberately NOT wired to push/commit messages:
# a full three-platform build is expensive, and commit-message-driven CI
# tempts you to push junk commits just to kick a build. Use the button.
#
# Artifacts:
#   - Every run uploads zips/tarballs as workflow artifacts.
#   - On a published release the archives are also attached to the release.
#
# Caveat: the macOS job signs ad-hoc (no certificate in CI). The app runs
# fine, but Keychain items are bound to the signing identity, so the
# credential vault may not survive reinstalling a freshly built artifact.
# For a vault-reliable macOS build, sign locally per README/AGENTS.
name: desktop-build

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pin to the version the project is developed and verified with.
          # Newer stables migrate the Xcode project / add SPM integration in
          # ways that break this build (pod install no-op → missing Pods
          # xcfilelists on macOS; pdfrx 1.3.5 fails Dart analysis on Windows).
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version && dart --version

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # webkit2gtk-4.1 (soup3-based) — desktop_webview_window prefers it;
          # the 4.0 fallback mixes soup2 headers into its GDateTime code.
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libasound2-dev \
            libmpv-dev libsecret-1-dev libjsoncpp-dev \
            librsvg2-dev libgirepository1.0-dev

      - name: Build (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        run: |
          # CI holds no certificate; rewrite signing to ad-hoc in the
          # checked-out project only. Verified locally: the sdk-scoped
          # identity must be overridden too — leaving "Apple Development"
          # with an empty team fails with "requires a development team".
          PB=macos/Runner.xcodeproj/project.pbxproj
          sed -i '' -E \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "[^"]*";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            "$PB"
          flutter build macos --release
          codesign -dv build/macos/Build/Products/Release/huichuang_basic.app 2>&1 \
            | grep -q 'Signature=adhoc'

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          # MSVC 14.5x turns the legacy /await + <experimental/coroutine>
          # pattern (flutter_inappwebview_windows, local_auth_windows) into
          # a hard STL1011 error; the vendor-documented define silences it.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Package (macOS zip with Applications link)
        if: runner.os == 'macOS'
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cd build/macos/Build/Products/Release
          rm -rf stage && mkdir stage
          cp -R huichuang_basic.app stage/
          # Drag-to-install: unzip yields the app next to an Applications
          # alias; dropping the app onto it copies it into /Applications.
          # zip -y keeps Applications a symlink instead of recursing into
          # the real /Applications (ditto cannot archive multiple sources).
          ln -s /Applications stage/Applications
          (cd stage && zip -qry \
            "../huichuang_basic-v${APP_VERSION}-macos-arm64.zip" \
            huichuang_basic.app Applications)

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          # Run AppImage tooling without FUSE (not available on runners).
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          # The gtk plugin ships as a script on raw master — it has no
          # release assets. linuxdeploy finds plugins via PATH.
          wget -q -O linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          export PATH="$PWD:$PATH"
          # The flutter bundle is self-contained next to its binary
          # (RPATH $ORIGIN/lib); place it under usr/bin as the AppDir payload.
          install -d AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/. AppDir/usr/bin/
          # linuxdeploy validates icon resolutions; render the master into
          # a valid 512x512 instead of passing the 1254x1254 original
          # (runner image ships ImageMagick 6 — `convert`, not `magick`).
          convert assets/icon.png -resize 512x512 icon-512.png
          OUTPUT="huichuang_basic-v${APP_VERSION}-linux-x64.AppImage" \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/huichuang_basic \
            --desktop-file packaging/linux/huichuang_basic.desktop \
            --icon-file icon-512.png \
            --plugin gtk --output appimage
      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = (Select-String '^version:\s*(\S+)' pubspec.yaml |
                      ForEach-Object { $_.Matches[0].Groups[1].Value }) -split '\+' | Select-Object -First 1
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss

      - name: Locate dist files
        id: dist
        shell: bash
        run: |
          dist=$(find . \( -name 'huichuang_basic-v*.zip' \
            -o -name 'huichuang_basic-v*.AppImage' \
            -o -name 'huichuang_basic-v*-setup.exe' \) | tr '\n' ' ')
          echo "files=$dist" >> "$GITHUB_OUTPUT"
          ls -l $dist

      - uses: actions/upload-artifact@v4
        with:
          name: huichuang_basic-${{ matrix.name }}
          path: |
            **/huichuang_basic-v*.zip
            **/huichuang_basic-v*.AppImage
            **/huichuang_basic-v*-setup.exe
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ${{ steps.dist.outputs.files }} --clobber
