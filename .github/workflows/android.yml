# Android build — release APK signed with the pinned release certificate.
#
# Manual dispatch ONLY (Actions → android-build → Run workflow). Nothing
# triggers it automatically: per the desktop rule, expensive builds run
# when you press the button. A published PRERELEASE never starts any CI;
# to ship its APK, dispatch this workflow with attach_tag set to the
# prerelease tag.
#
# Signing: the release keystore arrives via the KEYSTORE_BASE64 /
# KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD repo secrets and is decoded
# at build time — every shipped APK carries the SAME pinned certificate, so
# updates install over previous ones. Without the secrets the gradle build
# falls back to the per-runner debug keystore (dev builds only).

name: android-build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      abi:
        description: APK flavor
        type: choice
        default: universal
        options:
          - universal
          - split-per-abi
      attach_tag:
        description: 'Release tag to attach the APK(s) to (empty = artifact only)'
        type: string
        default: ''


concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version (.fvmrc)
        id: fv
        # .fvmrc is the single source of truth (fvm pin); keep CI in lockstep.
        run: |
          v=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          test -n "$v"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          # The action default is channel: stable, which cannot resolve the
          # pinned beta version (3.48.0-0.3.pre); opt into beta explicitly.
          channel: beta
          cache: true

      - name: Show toolchain
        run: flutter --version && dart --version

      # Release signing when the keystore secret exists; on secret-less
      # mirrors (manual test builds) fall through WITHOUT HC_KEYSTORE_PATH
      # so gradle signs with the debug key. The resulting APK installs only
      # beside other debug-signed builds — never upgrade-in-place over a
      # release-signed install.
      - name: Restore pinned release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret missing -> DEBUG-signed APK (manual-test build only)"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build APK (release, pinned-cert signed or debug fallback)
        env:
          HC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Export only when the keystore was restored: gradle picks release
          # signing purely on HC_KEYSTORE_PATH being set — an empty-string
          # env var would still read as "set" and break the debug fallback.
          if [ -s "$RUNNER_TEMP/release.keystore" ]; then
            export HC_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          fi
          flutter build apk --release \
            ${{ inputs.abi == 'split-per-abi' && '--split-per-abi' || '' }}

      - name: Rename dist files
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          # universal → android; split → arm64-v8a / armeabi-v7a / x86_64.
          # case, not a single sed: the plain app-release.apk name has no
          # middle segment, and a non-matching regex would keep the whole
          # 'app-release.apk' as the suffix, yielding a .apk.apk asset.
          for f in build/app/outputs/flutter-apk/*.apk; do
            case "$(basename "$f")" in
              app-release.apk)   suffix=android ;;
              app-*-release.apk) suffix=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/') ;;
              *)                 suffix=$(basename "$f" .apk) ;;
            esac
            mv "$f" "$(dirname "$f")/huichuang_basic-v${APP_VERSION}-${suffix}.apk"
          done

      - name: Locate dist files
        id: dist
        # Multiline output: upload-artifact splits `path` on newlines, so a
        # space-joined list would be treated as one (non-matching) pattern.
        run: |
          echo "files<<FILES_EOF" >> "$GITHUB_OUTPUT"
          ls build/app/outputs/flutter-apk/*.apk >> "$GITHUB_OUTPUT"
          echo "FILES_EOF" >> "$GITHUB_OUTPUT"
          ls -l build/app/outputs/flutter-apk

      - uses: actions/upload-artifact@v4
        with:
          name: huichuang_basic-android-${{ inputs.abi }}
          # APKs are already compressed; skip re-compression on upload.
          path: ${{ steps.dist.outputs.files }}
          compression-level: 0
          if-no-files-found: error

      - name: Attach to release
        if: inputs.attach_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ATTACH_TAG: ${{ inputs.attach_tag }}
          FILES: ${{ steps.dist.outputs.files }}
        run: gh release upload "$ATTACH_TAG" $(echo "$FILES" | xargs) --clobber
